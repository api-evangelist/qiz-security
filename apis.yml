aid: qiz-security
name: Qiz Security
description: 'QIZ Security is a cybersecurity company delivering a cryptography management platform for
  quantum-safe security. The platform helps organizations discover, prioritize, remediate, and govern
  their cryptographic assets across on-premises and cloud environments, making hidden cryptography visible
  and preparing them for post-quantum cryptography (PQC) adoption. Founded by experts in cybersecurity,
  networking, and post-quantum cryptography, QIZ Security is API-first and backed by Bessemer Venture
  Partners, with offices in Lewes, Delaware (US) and Ra''anana, Israel.'
